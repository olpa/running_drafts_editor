[package]
name = "running-drafts-editor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Line-oriented editor for recovering usable text from recordings"

[lib]
name = "running_drafts_editor"

[[bin]]
name = "rde"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.45", features = ["derive"] }
hex = "=0.4.3"
hound = "=3.5.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
thiserror = "=2.0.12"
whisper-rs = { path = "vendor/whisper-rs" }

[dev-dependencies]
proptest = "=1.7.0"
tempfile = "=3.20.0"

[profile.release]
strip = true
lto = "thin"
