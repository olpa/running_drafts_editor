<header class="toolbar">
  <label>
    Language
    <select data-testid="language">
      <option value="en">en</option>
      <option value="de">de</option>
      <option value="ru">ru</option>
    </select>
  </label>
  <button type="button" data-testid="start">Start</button>
  <button type="button" data-testid="pause">Pause</button>
  <button type="button" data-testid="continue">Continue</button>
  <button type="button" data-testid="stop">Stop</button>
  <button type="button" data-testid="cancel">Cancel</button>
  <span class="state" data-testid="state-label"></span>
  <span data-testid="elapsed" aria-label="Elapsed recording time">0:00</span>
</header>
<p data-testid="secured" role="status">Audio secured: 0:00</p>
<p data-testid="pending"></p>
<p data-testid="feedback" role="status" aria-live="polite"></p>
<button type="button" data-testid="retry" hidden>Upload pending audio</button>
