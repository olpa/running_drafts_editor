<div class="health-grid">
  <article class="health-card" data-testid="live-card">
    <div class="health-card-heading">
      <span class="health-icon" aria-hidden="true">L</span>
      <div>
        <h3>Service liveness</h3>
        <p>Confirms that the backend process is responding.</p>
      </div>
    </div>
    <code>/health/live</code>
    <button class="primary" type="button" data-testid="live-check">Check liveness</button>
    <div class="health-result" data-testid="live-result" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <strong data-testid="live-summary">Not checked</strong>
        <p data-testid="live-detail">Run the check to contact the backend.</p>
      </div>
    </div>
  </article>

  <article class="health-card" data-testid="ready-card">
    <div class="health-card-heading">
      <span class="health-icon" aria-hidden="true">R</span>
      <div>
        <h3>Database readiness</h3>
        <p>Confirms that the backend and its database are ready.</p>
      </div>
    </div>
    <code>/health/ready</code>
    <button class="primary" type="button" data-testid="ready-check">Check readiness</button>
    <div class="health-result" data-testid="ready-result" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <strong data-testid="ready-summary">Not checked</strong>
        <p data-testid="ready-detail">Run the check to contact the backend and database.</p>
      </div>
    </div>
  </article>
</div>
