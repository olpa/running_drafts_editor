services:
  web:
    image: running-drafts-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:?BACKEND_BASE_URL is required}
    ports:
      - "127.0.0.1:${HTTP_PORT:?HTTP_PORT is required}:8080"
      - "[::1]:${HTTP_PORT}:8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/health/live
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_reservation: 16m
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
